name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: linkforge
          POSTGRES_USER: linkforge
          POSTGRES_PASSWORD: linkforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkforge -d linkforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://linkforge:linkforge@localhost:5432/linkforge
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      ALLOW_TEST_DATABASE_RESET: "true"
      AUTH_RATE_LIMIT: 10
      API_RATE_LIMIT: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing
